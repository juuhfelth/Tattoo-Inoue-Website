<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portal Administrativo | Tattooo Inoue</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/portal adm.css">
    </head>
    <body>
            
    <header class="container_header">
        <nav class="navbar">

            <div class="logo">
                <a href="#" class="container_logo">TATTOO INOUE</a>
            </div>

            <ul class="lista_menu">
                <li class="lista_menu-item">
                    <a href="#inicio" class="lista_menu-link">Início</a>
                </li>
                <li class="lista_menu-item">
                    <a href="#agenda" class="lista_menu-link">Agenda</a>
                </li>
                <li class="lista_menu-item">
                    <a href="#solicitações" class="lista_menu-link">Solicitações</a>
                </li>
            </ul>

            <div class="container_icons">
                <a href="#" class="link_icon__agenda"><img class="icon_agenda" src="assets/agenda item.svg"></a>
                <a href="#" class="link_icon__login"><img class="icon_login" src="assets/login item.svg"></a>
                <span class="auth-user" hidden><img class="icon_user" src="assets/User.svg" alt="Usuário conectado"></span>
                <button type="button" class="auth-logout" aria-label="Sair da conta" title="Sair da conta" hidden>
                    <img class="icon_logout" src="assets/Logout.svg" alt="">
                </button>
                <span class="auth-logout-message" role="status" aria-live="polite" hidden></span>
            </div>

        </nav>

    </header>

    <section class="section__main">

        <h2>Bem vinda Milene!</h2>
        

    </section>

    <script src="script.js"></script>
        
    </body>
</html>
